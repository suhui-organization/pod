apiVersion: v1
kind: Secret
metadata:
  name: podcloud-secrets
  namespace: podcloud
type: Opaque
# JWT 密钥由 install-local.sh 注入:集群已有 Secret 则复用,否则随机生成
# (占位符 __JWT_SECRET__,仓库不提交任何固定密钥)
stringData:
  PODCLOUD_JWT_SECRET: "__JWT_SECRET__"
  # 计费（Paddle）。同样只放占位符：install-local.sh 从环境变量注入，
  # 没给就复用集群里已有的值，都没有则留空 —— 服务端把"没有计费配置"
  # 当成计费未开通处理，不会误开通订阅。
  PODCLOUD_BILLING_PROVIDER: "__PODCLOUD_BILLING_PROVIDER__"
  PADDLE_API_KEY: "__PADDLE_API_KEY__"
  PADDLE_WEBHOOK_SECRET: "__PADDLE_WEBHOOK_SECRET__"
  PADDLE_PRICE_PRO: "__PADDLE_PRICE_PRO__"
  PADDLE_CLIENT_TOKEN: "__PADDLE_CLIENT_TOKEN__"
  PADDLE_ENV: "__PADDLE_ENV__"
