apiVersion: apps/v1
kind: Deployment
metadata:
  name: podcloud-web
  namespace: podcloud
  labels:
    app: podcloud-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: podcloud-web
  template:
    metadata:
      labels:
        app: podcloud-web
    spec:
      containers:
        - name: web
          # 镜像 tag 由 install-local.sh 部署时注入(源码内容指纹 __WEB_IMAGE_TAG__)
          image: podcloud-web:__WEB_IMAGE_TAG__
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          env:
            - name: PODCLOUD_SERVER_UPSTREAM
              value: "podcloud-server:8000"
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: "1"
              memory: 512Mi
