# 海外静态镜像站：只服务「公开页面」（产品/定价/法务/登录页外壳）。
#
# 为什么需要它：源站是电信城域网地址，境外到源站的链路时好时坏 —— 走 CDN
# 回源也救不了（实测 ESA 海外节点会返回 522 Origin Connection Time-out）。
# 所以境外线路不再回源，直接由这台海外机器提供静态产物。
#
# 放在 /etc/nginx/conf.d/podcloud.conf，证书用 certbot 签。

server {
    listen 80;
    listen [::]:80;
    server_name podcloud.dlszjr.com;

    # certbot 的 HTTP-01 校验要能落到这里
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name podcloud.dlszjr.com;

    ssl_certificate     /etc/letsencrypt/live/podcloud.dlszjr.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/podcloud.dlszjr.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    root  /var/www/podcloud;
    index index.html;

    # 构建产物带内容哈希，可以长缓存；index.html 反过来不能缓存，
    # 否则发版后浏览器一直拿旧壳。
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # SPA 路由回退：/product、/pricing、/legal/* 都是前端路由
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 刻意不代理 /api/：后端还在国内源站，代理过去等于又把不稳定的
    # 国际链路引回来。海外访客只看公开页；要用控制台请走国内线路。
    location /api/ {
        default_type application/json;
        return 503 '{"error":{"code":503,"message":"API is not available on the overseas mirror; use the mainland endpoint."}}';
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
