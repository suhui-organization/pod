# 海外静态镜像站：只服务「公开页面」（产品/定价/法务/登录页外壳）。
#
# 这是**备选预案，日常不启用**：境外访问现在走 ESA（回源强制 HTTPS），
# 见同目录 README 的「现状」与「ESA 关键配置」。
#
# 只有再次出现「线路侧封锁境外入向、CDN 回源全 522」时才启用：把境外线路改为
# 指向这台海外机器，由它直接提供静态产物（不回源，不受国际链路抖动影响）。
#
# 放在 /etc/nginx/conf.d/podcloud.conf，证书用 certbot 签。

server {
    listen 80;
    listen [::]:80;
    server_name podcloud.dlszjr.com;

    # certbot 的 HTTP-01 校验要能落到这里
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name podcloud.dlszjr.com;

    ssl_certificate     /etc/letsencrypt/live/podcloud.dlszjr.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/podcloud.dlszjr.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    root  /var/www/podcloud;
    index index.html;

    # 构建产物带内容哈希，可以长缓存；index.html 反过来不能缓存，
    # 否则发版后浏览器一直拿旧壳。
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # SPA 路由回退：/product、/pricing、/legal/* 都是前端路由
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 刻意不代理 /api/：后端还在国内源站，代理过去等于又把不稳定的
    # 国际链路引回来。海外访客只看公开页；要用控制台请走国内线路。
    location /api/ {
        default_type application/json;
        return 503 '{"error":{"code":503,"message":"API is not available on the overseas mirror; use the mainland endpoint."}}';
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
